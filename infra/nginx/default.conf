add_header X-Content-Type-Options  "nosniff" always;
add_header X-Frame-Options         "SAMEORIGIN" always;
add_header Referrer-Policy         "strict-origin-when-cross-origin" always;

gzip_static on;

# Static assets copied verbatim from feg_games_assets keep their original
# filename across builds (no content hash), unlike the Vite-bundled JS
# chunks below - so they must never be cached as immutable.
location ~ "/assets/(panel|locale|fonts|history|images|payTableImages|env)/" {
    add_header Cache-Control "no-cache";
}

location ~* \.(js|css|woff2?|ttf)$ {
    add_header Cache-Control "public, max-age=31536000, immutable";
}

location ~* \.(mp3|ogg|wav|atlas|skel|png|jpg|webp|svg|ico)$ {
    add_header Cache-Control "public, max-age=86400";
}

location = /assets/env/commonConfig.json {
    add_header Cache-Control "no-store, no-cache";
}

location / {
    try_files $uri $uri/ =404;
}
