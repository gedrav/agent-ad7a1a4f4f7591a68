apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.packName }}
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ .Values.packName }}
spec:
  selector:
    app: {{ .Values.packName }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.port }}
      protocol: TCP
