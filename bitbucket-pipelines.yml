image: node:22-bullseye

clone:
  depth: 1

definitions:
  steps:
    # -----------------------------------------------------------------
    # Build & Deploy to a specific environment.
    #
    # Required repo-level variables:
    #   ASSETS_REPO_ACCESS_TOKEN - Bitbucket token with read access to feg_games_assets
    #   AZURE_CLIENT_ID          - Azure SP app ID (feg-slot-fe-ci)
    #   AZURE_CLIENT_SECRET      - Azure SP secret
    #   AZURE_TENANT_ID          - Azure tenant ID
    #   AZURE_SUBSCRIPTION_ID    - Azure subscription ID
    #
    # Required deployment environment variables:
    #   SLOT_FE_STORAGE_ACCOUNT  - Storage account name (e.g. fegslotfedev)
    #   SLOT_FE_CDN_RG           - Resource group (e.g. feg-slot-rg-dev)
    #   SLOT_FE_CDN_PROFILE      - AFD profile name (optional for dev, required for staging/prod)
    #   SLOT_FE_CDN_ENDPOINT     - AFD endpoint name (optional for dev, required for staging/prod)
    # -----------------------------------------------------------------

# -----------------------------------------------------------------
# Pipelines
# -----------------------------------------------------------------
pipelines:
  # -- Auto-trigger: push to main -> deploy to dev ------------------
  branches:
    main:
      - step:
          name: Build & deploy to dev
          caches:
            - node
          deployment: dev
          script:
            - >
              git clone --depth 1
              https://x-token-auth:$ASSETS_REPO_ACCESS_TOKEN@bitbucket.org/$BITBUCKET_WORKSPACE/feg_games_assets.git
              -b main
              ../feg_games_assets
            - npm ci
            - BUILD_OUTPUT_ROOT=../feg_slot_build npm run build:development
            - cp staticwebapp.config.json ../feg_slot_build/
            - curl -sL https://aka.ms/InstallAzureCLIDeb | bash
            - az login --service-principal --username "$AZURE_CLIENT_ID" --password "$AZURE_CLIENT_SECRET" --tenant "$AZURE_TENANT_ID"
            - az account set --subscription "$AZURE_SUBSCRIPTION_ID"
            - >
              az storage blob upload-batch
              --account-name "$SLOT_FE_STORAGE_ACCOUNT"
              --source ../feg_slot_build
              --destination '$web'
              --auth-mode login
              --overwrite
              --output none
            - |
              if [ -n "$SLOT_FE_CDN_PROFILE" ] && [ -n "$SLOT_FE_CDN_ENDPOINT" ]; then
                az afd endpoint purge \
                  --resource-group "$SLOT_FE_CDN_RG" \
                  --profile-name "$SLOT_FE_CDN_PROFILE" \
                  --endpoint-name "$SLOT_FE_CDN_ENDPOINT" \
                  --content-paths '/*' \
                  --no-wait
              fi

  # -- Manual triggers ----------------------------------------------
  custom:
    deploy-dev:
      - step:
          name: Build & deploy to dev
          caches:
            - node
          deployment: dev
          script:
            - >
              git clone --depth 1
              https://x-token-auth:$ASSETS_REPO_ACCESS_TOKEN@bitbucket.org/$BITBUCKET_WORKSPACE/feg_games_assets.git
              -b main
              ../feg_games_assets
            - npm ci
            - BUILD_OUTPUT_ROOT=../feg_slot_build npm run build:development
            - cp staticwebapp.config.json ../feg_slot_build/
            - curl -sL https://aka.ms/InstallAzureCLIDeb | bash
            - az login --service-principal --username "$AZURE_CLIENT_ID" --password "$AZURE_CLIENT_SECRET" --tenant "$AZURE_TENANT_ID"
            - az account set --subscription "$AZURE_SUBSCRIPTION_ID"
            - >
              az storage blob upload-batch
              --account-name "$SLOT_FE_STORAGE_ACCOUNT"
              --source ../feg_slot_build
              --destination '$web'
              --auth-mode login
              --overwrite
              --output none
            - |
              if [ -n "$SLOT_FE_CDN_PROFILE" ] && [ -n "$SLOT_FE_CDN_ENDPOINT" ]; then
                az afd endpoint purge \
                  --resource-group "$SLOT_FE_CDN_RG" \
                  --profile-name "$SLOT_FE_CDN_PROFILE" \
                  --endpoint-name "$SLOT_FE_CDN_ENDPOINT" \
                  --content-paths '/*' \
                  --no-wait
              fi

    deploy-staging:
      - step:
          name: Build & deploy to staging
          caches:
            - node
          deployment: staging
          script:
            - >
              git clone --depth 1
              https://x-token-auth:$ASSETS_REPO_ACCESS_TOKEN@bitbucket.org/$BITBUCKET_WORKSPACE/feg_games_assets.git
              -b main
              ../feg_games_assets
            - npm ci
            - BUILD_OUTPUT_ROOT=../feg_slot_build npm run build:staging
            - cp staticwebapp.config.json ../feg_slot_build/
            - curl -sL https://aka.ms/InstallAzureCLIDeb | bash
            - az login --service-principal --username "$AZURE_CLIENT_ID" --password "$AZURE_CLIENT_SECRET" --tenant "$AZURE_TENANT_ID"
            - az account set --subscription "$AZURE_SUBSCRIPTION_ID"
            - >
              az storage blob upload-batch
              --account-name "$SLOT_FE_STORAGE_ACCOUNT"
              --source ../feg_slot_build
              --destination '$web'
              --auth-mode login
              --overwrite
              --output none
            - >
              az afd endpoint purge
              --resource-group "$SLOT_FE_CDN_RG"
              --profile-name "$SLOT_FE_CDN_PROFILE"
              --endpoint-name "$SLOT_FE_CDN_ENDPOINT"
              --content-paths '/*'
              --no-wait

    deploy-prod:
      - step:
          name: Build & deploy to production
          caches:
            - node
          deployment: production
          script:
            - >
              git clone --depth 1
              https://x-token-auth:$ASSETS_REPO_ACCESS_TOKEN@bitbucket.org/$BITBUCKET_WORKSPACE/feg_games_assets.git
              -b main
