image: node:22-bullseye

clone:
  depth: 1

definitions:
  steps:
    # ─────────────────────────────────────────────────────────────
    # Build & Deploy to a specific environment.
    # Required pipeline variables (per deployment environment):
    #   SWA_DEPLOYMENT_TOKEN  — Azure SWA deployment token
    #                           (pulumi stack output feSlotDeploymentToken)
    #   SWA_NAME              — Azure Static Web App name
    #                           (e.g. feg-slot-fe-dev)
    #   AZURE_RESOURCE_GROUP  — Resource group (e.g. feg-slot-rg-dev)
    #
    # Required repo-level variables:
    #   ASSETS_REPO_ACCESS_TOKEN — Bitbucket token with read access to feg_games_assets
    #
    # URLs are sourced from the committed .env.* files in the repo.
    # No runtime patching required.
    # ─────────────────────────────────────────────────────────────

    - step: &clone-and-install
        name: Clone assets & install
        caches:
          - node
        script:
          - >
            git clone --depth 1
            https://x-token-auth:$ASSETS_REPO_ACCESS_TOKEN@bitbucket.org/$BITBUCKET_WORKSPACE/feg_games_assets.git
            -b main
            ../feg_games_assets
          - npm ci

    - step: &deploy
        name: Deploy to SWA
        script:
          - cp staticwebapp.config.json ../feg_slot_build/
          - npx --yes @azure/static-web-apps-cli@2 deploy ../feg_slot_build --deployment-token "$SWA_DEPLOYMENT_TOKEN" --env production --verbose || exit 1

# ─────────────────────────────────────────────────────────────────
# Pipelines
# ─────────────────────────────────────────────────────────────────
pipelines:
  # ── Auto-trigger: push to main → deploy to dev ───────────────
  branches:
    main:
      - step:
          <<: *clone-and-install
          name: Build (development)
          deployment: dev
          script:
            - >
              git clone --depth 1
              https://x-token-auth:$ASSETS_REPO_ACCESS_TOKEN@bitbucket.org/$BITBUCKET_WORKSPACE/feg_games_assets.git
              -b main
              ../feg_games_assets
            - npm ci
            - BUILD_OUTPUT_ROOT=../feg_slot_build npm run build:development
      - step:
          <<: *deploy
          name: Deploy to dev
          deployment: dev

  # ── Manual triggers ──────────────────────────────────────────
  custom:
    deploy-dev:
      - step:
          name: Build & deploy to dev
          caches:
            - node
          deployment: dev
          script:
            - >
              git clone --depth 1
              https://x-token-auth:$ASSETS_REPO_ACCESS_TOKEN@bitbucket.org/$BITBUCKET_WORKSPACE/feg_games_assets.git
              -b main
              ../feg_games_assets
            - npm ci
            - BUILD_OUTPUT_ROOT=../feg_slot_build npm run build:development
            - cp staticwebapp.config.json ../feg_slot_build/
            - npx --yes @azure/static-web-apps-cli@2 deploy ../feg_slot_build --deployment-token "$SWA_DEPLOYMENT_TOKEN" --env production --verbose || exit 1

    deploy-staging:
      - step:
          name: Build & deploy to staging
          caches:
            - node
          deployment: staging
          script:
            - >
              git clone --depth 1
              https://x-token-auth:$ASSETS_REPO_ACCESS_TOKEN@bitbucket.org/$BITBUCKET_WORKSPACE/feg_games_assets.git
              -b main
              ../feg_games_assets
            - npm ci
            - BUILD_OUTPUT_ROOT=../feg_slot_build npm run build:staging
            - cp staticwebapp.config.json ../feg_slot_build/
            - npx --yes @azure/static-web-apps-cli@2 deploy ../feg_slot_build --deployment-token "$SWA_DEPLOYMENT_TOKEN" --env production --verbose || exit 1

    deploy-prod:
      - step:
          name: Build & deploy to production
          caches:
            - node
          deployment: production
          script:
            - >
              git clone --depth 1
              https://x-token-auth:$ASSETS_REPO_ACCESS_TOKEN@bitbucket.org/$BITBUCKET_WORKSPACE/feg_games_assets.git
              -b main
              ../feg_games_assets
            - npm ci
            - BUILD_OUTPUT_ROOT=../feg_slot_build npm run build
            - cp staticwebapp.config.json ../feg_slot_build/
            - npx --yes @azure/static-web-apps-cli@2 deploy ../feg_slot_build --deployment-token "$SWA_DEPLOYMENT_TOKEN" --env production --verbose || exit 1
