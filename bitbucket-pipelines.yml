image: node:22-bullseye

clone:
  depth: 1

definitions:
  steps:
    # -----------------------------------------------------------------
    # Build & Deploy to a specific environment.
    #
    # Required repo-level variables:
    #   ASSETS_REPO_ACCESS_TOKEN - Bitbucket token with read access to feg_games_assets
    #   AZURE_CLIENT_ID          - Azure SP app ID (feg-slot-fe-ci)
    #   AZURE_CLIENT_SECRET      - Azure SP secret
    #   AZURE_TENANT_ID          - Azure tenant ID
    #   AZURE_SUBSCRIPTION_ID    - Azure subscription ID
    #
    # Required deployment environment variables (dev):
    #   SLOT_FE_STORAGE_ACCOUNT  - Storage account name (e.g. fegslotfedev)
    #   SLOT_FE_CDN_RG           - Resource group (optional, skip purge if unset)
    #   SLOT_FE_CDN_PROFILE      - AFD profile name (optional, skip purge if unset)
    #   SLOT_FE_CDN_ENDPOINT     - AFD endpoint name (optional, skip purge if unset)
    #
    # Required deployment environment variables (staging):
    #   SLOT_FE_STORAGE_ACCOUNT  - Storage account name (fegslotfestaging)
    #   SLOT_FE_CDN_RG           - Resource group (feg-slot-rg-staging)
    #   SLOT_FE_CDN_PROFILE      - AFD profile name (feg-slot-afd-staging)
    #   SLOT_FE_CDN_ENDPOINT     - AFD endpoint name (feg-slot-fe-staging)
    # -----------------------------------------------------------------

# -----------------------------------------------------------------
# Pipelines
# -----------------------------------------------------------------
pipelines:
  # -- Auto-trigger: push to main -> deploy to dev ------------------
  branches:
    main:
      - step:
          name: Build & deploy to dev
          caches:
            - node
          deployment: dev
          script:
            - >
              git clone --depth 1
              https://x-token-auth:$ASSETS_REPO_ACCESS_TOKEN@bitbucket.org/$BITBUCKET_WORKSPACE/feg_games_assets.git
              -b main
              ../feg_games_assets
            - npm ci
            - BUILD_OUTPUT_ROOT=../feg_slot_build npm run build:development
            - cp staticwebapp.config.json ../feg_slot_build/
            - curl -sL https://aka.ms/downloadazcopy-v10-linux | tar -xz --wildcards '*/azcopy' --strip-components=1
            - AZCOPY_SPA_CLIENT_SECRET="$AZURE_CLIENT_SECRET" ./azcopy login --service-principal --application-id "$AZURE_CLIENT_ID" --tenant-id "$AZURE_TENANT_ID"
            - ./azcopy sync ../feg_slot_build "https://$SLOT_FE_STORAGE_ACCOUNT.blob.core.windows.net/\$web" --recursive --delete-destination=true
            - |
              if [ -n "$SLOT_FE_CDN_PROFILE" ] && [ -n "$SLOT_FE_CDN_ENDPOINT" ]; then
                curl -sL https://aka.ms/InstallAzureCLIDeb | bash
                az login --service-principal --username "$AZURE_CLIENT_ID" --password "$AZURE_CLIENT_SECRET" --tenant "$AZURE_TENANT_ID"
                az account set --subscription "$AZURE_SUBSCRIPTION_ID"
                az afd endpoint purge \
                  --resource-group "$SLOT_FE_CDN_RG" \
                  --profile-name "$SLOT_FE_CDN_PROFILE" \
                  --endpoint-name "$SLOT_FE_CDN_ENDPOINT" \
                  --content-paths '/*' \
                  --no-wait
              fi

  # -- Manual triggers ----------------------------------------------
  custom:
    deploy-dev:
      - step:
          name: Build & deploy to dev
          caches:
            - node
          deployment: dev
          script:
            - >
              git clone --depth 1
              https://x-token-auth:$ASSETS_REPO_ACCESS_TOKEN@bitbucket.org/$BITBUCKET_WORKSPACE/feg_games_assets.git
              -b main
              ../feg_games_assets
            - npm ci
            - BUILD_OUTPUT_ROOT=../feg_slot_build npm run build:development
            - cp staticwebapp.config.json ../feg_slot_build/
            - curl -sL https://aka.ms/downloadazcopy-v10-linux | tar -xz --wildcards '*/azcopy' --strip-components=1
            - AZCOPY_SPA_CLIENT_SECRET="$AZURE_CLIENT_SECRET" ./azcopy login --service-principal --application-id "$AZURE_CLIENT_ID" --tenant-id "$AZURE_TENANT_ID"
            - ./azcopy sync ../feg_slot_build "https://$SLOT_FE_STORAGE_ACCOUNT.blob.core.windows.net/\$web" --recursive --delete-destination=true
            - |
              if [ -n "$SLOT_FE_CDN_PROFILE" ] && [ -n "$SLOT_FE_CDN_ENDPOINT" ]; then
                curl -sL https://aka.ms/InstallAzureCLIDeb | bash
                az login --service-principal --username "$AZURE_CLIENT_ID" --password "$AZURE_CLIENT_SECRET" --tenant "$AZURE_TENANT_ID"
                az account set --subscription "$AZURE_SUBSCRIPTION_ID"
                az afd endpoint purge \
                  --resource-group "$SLOT_FE_CDN_RG" \
                  --profile-name "$SLOT_FE_CDN_PROFILE" \
                  --endpoint-name "$SLOT_FE_CDN_ENDPOINT" \
                  --content-paths '/*' \
                  --no-wait
              fi

    deploy-staging:
      - step:
          name: Build & deploy to staging
          caches:
            - node
          deployment: staging
          script:
            - >
              git clone --depth 1
              https://x-token-auth:$ASSETS_REPO_ACCESS_TOKEN@bitbucket.org/$BITBUCKET_WORKSPACE/feg_games_assets.git
              -b main
              ../feg_games_assets
            - npm ci
            - BUILD_OUTPUT_ROOT=../feg_slot_build npm run build:staging
            - curl -sL https://aka.ms/downloadazcopy-v10-linux | tar -xz --wildcards '*/azcopy' --strip-components=1
            - AZCOPY_SPA_CLIENT_SECRET="$AZURE_CLIENT_SECRET" ./azcopy login --service-principal --application-id "$AZURE_CLIENT_ID" --tenant-id "$AZURE_TENANT_ID"
            - ./azcopy copy "../feg_slot_build/*" "https://$SLOT_FE_STORAGE_ACCOUNT.blob.core.windows.net/\$web" --recursive --overwrite=true
            - |
              if [ -n "$SLOT_FE_CDN_PROFILE" ] && [ -n "$SLOT_FE_CDN_ENDPOINT" ]; then
                curl -sL https://aka.ms/InstallAzureCLIDeb | bash
                az login --service-principal --username "$AZURE_CLIENT_ID" --password "$AZURE_CLIENT_SECRET" --tenant "$AZURE_TENANT_ID"
                az account set --subscription "$AZURE_SUBSCRIPTION_ID"
                az afd endpoint purge \
                  --resource-group "$SLOT_FE_CDN_RG" \
                  --profile-name "$SLOT_FE_CDN_PROFILE" \
                  --endpoint-name "$SLOT_FE_CDN_ENDPOINT" \
                  --content-paths '/*' \
                  --no-wait
              fi

    deploy-prod:
      - step:
          name: Build & deploy to production
          caches:
            - node
          deployment: production
          script:
            - >
              git clone --depth 1
              https://x-token-auth:$ASSETS_REPO_ACCESS_TOKEN@bitbucket.org/$BITBUCKET_WORKSPACE/feg_games_assets.git
              -b main
              ../feg_games_assets
            - npm ci
            - BUILD_OUTPUT_ROOT=../feg_slot_build npm run build
            - cp staticwebapp.config.json ../feg_slot_build/
            - curl -sL https://aka.ms/downloadazcopy-v10-linux | tar -xz --wildcards '*/azcopy' --strip-components=1
            - AZCOPY_SPA_CLIENT_SECRET="$AZURE_CLIENT_SECRET" ./azcopy login --service-principal --application-id "$AZURE_CLIENT_ID" --tenant-id "$AZURE_TENANT_ID"
            - ./azcopy sync ../feg_slot_build "https://$SLOT_FE_STORAGE_ACCOUNT.blob.core.windows.net/\$web" --recursive --delete-destination=true
            - curl -sL https://aka.ms/InstallAzureCLIDeb | bash
            - az login --service-principal --username "$AZURE_CLIENT_ID" --password "$AZURE_CLIENT_SECRET" --tenant "$AZURE_TENANT_ID"
            - az account set --subscription "$AZURE_SUBSCRIPTION_ID"
            - >
              az afd endpoint purge
              --resource-group "$SLOT_FE_CDN_RG"
              --profile-name "$SLOT_FE_CDN_PROFILE"
              --endpoint-name "$SLOT_FE_CDN_ENDPOINT"
              --content-paths '/*'
              --no-wait
